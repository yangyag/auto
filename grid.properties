# 최소 매수값 = 최하단 슬롯 buy_price (업비트 호가 단위에 맞는 값으로 직접 입력)
MIN_BUY_PRICE=1450

# 최고 매수값 = 최상단 슬롯 buy_price (업비트 호가 단위에 맞는 값으로 직접 입력)
MAX_BUY_PRICE=1500

# 그리드 전체에 배정할 총예산 KRW
TOTAL_BUDGET_KRW=10000000

# GRID_COUNT 또는 GRID_STEP_PCT 중 정확히 하나만 사용
GRID_STEP_PCT=0.2

# 신규 기본 TP 모델
TP_MODEL=k
TP_K_BASE=3.2
TP_K_FLOOR=3.0

# 손절 모드: band_multiple (권장) | fixed_pct | off
# 현재 off — 그리드 폭(1450~1500, 3.45%)이 좁아 band_multiple(폭 5.26%+ 필요)이 적용 불가하여 손절 미사용.
STOP_LOSS_MODE=off

# band_multiple 모드 - k 값 (1.0 ~ 2.0). 현재 STOP_LOSS_MODE=off 라 미사용.
STOP_LOSS_BAND_MULTIPLE=1.55

# fixed_pct 모드 - 백분율
STOP_LOSS_L0_PCT=10
STOP_LOSS_L1_PCT=20
STOP_LOSS_L2_PCT=30

# 컨펌 캔들
STOP_LOSS_CANDLE_UNIT=15
STOP_LOSS_L0_CONSECUTIVE_CLOSES=4
STOP_LOSS_L1_CONSECUTIVE_CLOSES=4
STOP_LOSS_L2_CONSECUTIVE_CLOSES=2

# [현재 미사용] 아래 ARM_HOLD 값은 코드가 읽지 않아 손절 동작에 영향 없음 (로드/양수검증만 됨).
# 실제 손절 컨펌 지연은 STOP_LOSS_CANDLE_UNIT × STOP_LOSS_Ln_CONSECUTIVE_CLOSES 로 결정됨 (L1 약 60분, L2 약 30분).
STOP_LOSS_L1_ARM_HOLD_SECONDS=3600
STOP_LOSS_L2_ARM_HOLD_SECONDS=1800

# 청산 비율
STOP_LOSS_L1_LIQUIDATE_RATIO=0.5

# L2 이후 재시작 잠금 (시간)
STOP_LOSS_RESTART_LOCKOUT_HOURS=24
